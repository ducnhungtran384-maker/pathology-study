<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>病理识图 · 考前练习</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header"><a href="#" class="brand" aria-label="返回刷题">✚ <b>病理识图</b></a><nav aria-label="主导航"><button data-nav="practice" class="active">刷题</button><button data-nav="wrong">错题 <span id="nav-wrong">0</span></button><button data-nav="atlas">速记</button><button id="more-open">更多</button></nav><button id="cloud-open" class="cloud-header" aria-label="打开云同步"><span aria-hidden="true">☁</span> <span id="cloud-status">云同步</span></button></header>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="zoom-dialog" aria-label="标本图片放大"><header><b id="zoom-title">查看标本</b><div><button id="zoom-annotations" hidden>隐藏标注</button><button id="zoom-minus" aria-label="缩小">−</button><span id="zoom-level">100%</span><button id="zoom-plus" aria-label="放大">＋</button><button id="zoom-close">关闭</button></div></header><div class="zoom-stage"><div id="zoom-canvas"></div></div></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="dialog-body"><h2 id="confirm-title">确认操作</h2><p id="confirm-message"></p><div class="dialog-actions"><button id="confirm-cancel" autofocus>取消</button><button id="confirm-yes" class="primary">确认</button></div></div></dialog>
<dialog id="more-dialog" aria-labelledby="more-title"><div class="dialog-body"><div class="section-head"><h2 id="more-title">更多</h2><button id="more-close" class="quiet">关闭</button></div><div class="more-actions"><button data-more="exam">20 题自测<span>交卷后看答案</span></button><button data-more="saved">我的收藏<span id="saved-count">0 题</span></button><button data-more="audit">资料核对<span>出处、纠错与疑图</span></button></div><label class="extension-option"><input type="checkbox" id="include-extension"> 加入旧网页的 17 道拓展题</label><div class="backup-actions"><button id="export">导出进度</button><button id="import">导入进度</button><button id="reset" class="quiet">清空进度</button></div><p class="fine" id="storage-note">进度保存在当前浏览器。换设备前请先导出。</p></div></dialog>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<dialog id="cloud-dialog" aria-labelledby="cloud-title"><div class="dialog-body"><div class="section-head"><h2 id="cloud-title">多端同步</h2><button id="cloud-close" class="quiet">关闭</button></div><p id="cloud-message" role="status" aria-live="polite">开启后，作答、错题、收藏和当前题组会自动保存到云端。</p><div id="cloud-unavailable" hidden><p class="muted">这个离线包只保存在当前浏览器。请使用已启用云同步的在线网址。</p></div><div id="cloud-signed-out"><button id="cloud-create" class="primary cloud-wide">首次使用：开启云同步</button><div class="cloud-divider">已有同步码</div><label class="cloud-label" for="cloud-code-input">在另一台设备输入同一同步码</label><input id="cloud-code-input" class="cloud-code" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 BL- 开头的完整同步码"><button id="cloud-connect" class="cloud-wide">连接已有进度</button></div><div id="cloud-signed-in" hidden><label class="cloud-label" for="cloud-code">你的同步码</label><div class="cloud-code-row"><input id="cloud-code" class="cloud-code" type="password" readonly autocomplete="off" aria-label="你的同步码"><button id="cloud-reveal" aria-label="显示同步码">显示</button><button id="cloud-copy">复制</button></div><p class="fine">同步码相当于密码。请保存到自己的密码管理器，不要分享给他人；另一台设备输入它即可继续练习。</p><div class="cloud-actions"><button id="cloud-sync" class="primary">立即同步</button><button id="cloud-disconnect" class="quiet">退出此设备</button></div></div><section id="cloud-conflict" class="cloud-conflict" hidden aria-labelledby="cloud-conflict-title"><h3 id="cloud-conflict-title">两台设备都有新的进度</h3><p>为避免覆盖，请选择本次保留哪一份。两份进度会先备份在此浏览器。</p><div class="cloud-actions"><button id="cloud-use-remote" class="primary">使用云端进度</button><button id="cloud-use-local">保留本机进度</button></div></section><section id="cloud-backups" class="cloud-backups" hidden><label class="cloud-label" for="cloud-backup-select">之前保留的进度备份</label><select id="cloud-backup-select" class="cloud-code" aria-label="选择进度备份"></select><button id="cloud-backup-download" class="cloud-wide">下载这份备份</button><p class="fine">下载后，可用“更多 → 导入进度”恢复。</p></section><p class="fine cloud-migration">旧网址或离线版的进度：先在原页面“更多 → 导出进度”，再到这里“更多 → 导入进度”。</p></div></dialog>
<script src="data.js"></script><script src="cloud-config.js"></script><script src="cloud-sync.js"></script><script src="app.js"></script>
</body></html>
