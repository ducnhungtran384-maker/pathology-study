<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#eef3e9"><title>病理识图</title>
<meta name="description" content="病理图像练习，包含识别要点、图像标注和选项鉴别。">
<link rel="stylesheet" href="style.css?v=bb75fd5e1dbf">
</head>
<body>
<a href="#main" class="skip-link">跳到题目</a>
<header class="app-header">
  <a href="#" class="brand" aria-label="病理识图，返回刷题"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 32 32"><ellipse cx="16" cy="16" rx="11" ry="12"/><ellipse cx="16" cy="16" rx="4" ry="5"/><path d="M8 10l3 2m10 8 3 2"/></svg></span><b>病理识图</b></a>
  <nav aria-label="主导航">
    <button data-nav="practice" class="active" aria-label="识图练习"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></svg><span class="nav-full">识图练习</span><span class="nav-short" aria-hidden="true">练习</span></button>
    <button data-nav="wrong" aria-label="错题本"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h10a2 2 0 0 1 2 2v16H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm-3 15a3 3 0 0 1 3-3h12M12 7l4 4m0-4-4 4"/></svg><span class="nav-full">错题本</span><span class="nav-short" aria-hidden="true">错题</span><span class="nav-count" id="nav-wrong">0</span></button>
    <button data-nav="atlas" aria-label="识别速记"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="nav-full">识别速记</span><span class="nav-short" aria-hidden="true">速记</span></button>
    <button data-nav="saved" aria-label="我的收藏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4Z"/></svg><span class="nav-full">我的收藏</span><span class="nav-short" aria-hidden="true">收藏</span><span class="nav-count" id="saved-count">0</span></button>
  </nav>
  <button id="more-open" class="settings-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span>更多</span></button>
</header>
<main id="main" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="study-dialog" aria-labelledby="study-title"><div class="study-head"><h2 id="study-title">题目解析</h2><button id="study-close" class="quiet" autofocus>关闭</button></div><section id="study-modal" class="study-shell" aria-label="题目解析"></section></dialog>
<dialog id="zoom-dialog" aria-label="标本图片放大"><header><b id="zoom-title">查看标本</b><div><button id="zoom-annotations" hidden>隐藏标注</button><button id="zoom-minus" aria-label="缩小">−</button><span id="zoom-level">100%</span><button id="zoom-plus" aria-label="放大">＋</button><button id="zoom-close">关闭</button></div></header><div class="zoom-layout"><div class="zoom-stage"><div id="zoom-canvas"></div></div><aside id="zoom-notes" class="annotation-rail study-shell" aria-label="放大图片的标注说明" hidden></aside></div></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="dialog-body"><h2 id="confirm-title">确认操作</h2><p id="confirm-message"></p><div class="dialog-actions"><button id="confirm-cancel" autofocus>取消</button><button id="confirm-yes" class="primary">确认</button></div></div></dialog>
<dialog id="more-dialog" aria-labelledby="more-title"><div class="dialog-body"><div class="section-head"><h2 id="more-title">练习与进度</h2><button id="more-close" class="quiet">关闭</button></div><div class="more-actions"><button data-more="exam">20 题自测<span>交卷后看解析 →</span></button></div><label class="extension-option"><input type="checkbox" id="include-extension"> 包含拓展题（17 题）</label><div class="backup-actions"><button id="export">导出进度</button><button id="import">导入进度</button><button id="reset" class="quiet">清空进度</button></div><p class="fine" id="storage-note">记录保存在此浏览器。换设备或清理数据前，请先导出。</p></div></dialog>
<input id="import-file" type="file" accept="application/json,.json" hidden>

<script src="data.js?v=bb75fd5e1dbf"></script><script src="app.js?v=bb75fd5e1dbf"></script>
</body></html>
